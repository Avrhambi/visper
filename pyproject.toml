[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "visper"
version = "1.1.0"
description = "Hebrew speech-to-text transcription engine"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper",
    "sounddevice",
    "numpy",
    "tqdm",
    "pyperclip",
    "mutagen",
    "soundfile",
    "pyyaml",
    "py-cpuinfo",
    "psutil",
    "noisereduce",
    "librosa",
    "scipy",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.100",
    "uvicorn[standard]",
    "sse-starlette",
    "python-multipart",
]
mlx = ["mlx-whisper"]

[project.scripts]
visper-file      = "visper._cli:file"
visper-live      = "visper._cli:live"
visper-benchmark = "visper._cli:benchmark"
visper-server    = "visper.server:main"
visper-help      = "visper._cli:help"

[tool.setuptools.packages.find]
where = ["."]
include = ["visper"]
