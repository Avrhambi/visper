[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "local-stt-he"
version = "0.2.0"
description = "Hebrew speech-to-text transcription engine"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper",
    "sounddevice",
    "numpy",
    "tqdm",
    "pyperclip",
    "mutagen",
    "soundfile",
    "pyyaml",
    "py-cpuinfo",
    "psutil",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.100",
    "uvicorn[standard]",
    "sse-starlette",
    "python-multipart",
]

[project.scripts]
stt-file      = "transcribe_file:main"
stt-live      = "transcribe_live:main"
stt-benchmark = "run_benchmark:main"
stt-server    = "server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*"]
