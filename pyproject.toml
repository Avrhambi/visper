[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "visper"
version = "0.2.0"
description = "Hebrew speech-to-text transcription engine"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper",
    "sounddevice",
    "numpy",
    "tqdm",
    "pyperclip",
    "mutagen",
    "soundfile",
    "pyyaml",
    "py-cpuinfo",
    "psutil",
    "noisereduce",
    "librosa",
    "scipy",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.100",
    "uvicorn[standard]",
    "sse-starlette",
    "python-multipart",
]

[project.scripts]
visper-file      = "local_stt_he._cli:file"
visper-live      = "local_stt_he._cli:live"
visper-benchmark = "local_stt_he._cli:benchmark"
visper-server    = "local_stt_he.server:main"
visper-help      = "local_stt_he._cli:help"

[tool.setuptools.packages.find]
where = ["."]
include = ["local_stt_he*"]
