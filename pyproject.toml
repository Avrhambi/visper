[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "visper"
dynamic = ["version"]
description = "Local, offline multilingual speech-to-text — Hebrew-first, self-benchmarking"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Avrham" }]
dependencies = [
    "faster-whisper>=1.0",
    "sounddevice>=0.4",
    "numpy>=1.24",
    "tqdm>=4.65",
    "pyperclip>=1.8",
    "mutagen>=1.46",
    "soundfile>=0.12",
    "pyyaml>=6.0",
    "py-cpuinfo>=9.0",
    "psutil>=5.9",
    "noisereduce>=3.0",
    "librosa>=0.10",
    "scipy>=1.10",
    "sentencepiece>=0.2",   # he->en translation tokeniser; ctranslate2 comes via faster-whisper
]

[project.optional-dependencies]
server = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "sse-starlette>=1.6",
    "python-multipart>=0.0.6",
]
mlx = ["mlx-whisper>=0.3"]
dev = [
    "pytest>=7.4",
    "jiwer>=3.0",          # WER/CER for visper-eval (eval-only, not a runtime dep)
]

[project.scripts]
visper-file      = "visper._cli:file"
visper-live      = "visper._cli:live"
visper-benchmark = "visper._cli:benchmark"
visper-eval      = "visper._cli:eval_"
visper-server    = "visper.server:main"
visper-help      = "visper._cli:help"

[tool.setuptools.packages.find]
where = ["."]
include = ["visper"]

[tool.setuptools.package-data]
visper = ["config.yaml"]

[tool.setuptools.dynamic]
version = { attr = "visper.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-q"
