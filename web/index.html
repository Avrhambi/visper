<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local STT — Hebrew</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      padding: 2rem 1rem; color: #1a1a1a;
    }
    .card {
      background: white; border-radius: 14px; padding: 2rem;
      width: 100%; max-width: 680px; box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    /* header */
    .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.25rem; }
    h1 { font-size: 1.3rem; font-weight: 600; }
    .health { font-size: .78rem; color: #888; display: flex; align-items: center; gap: .4rem; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; flex-shrink: 0; }
    .dot.ok  { background: #3cb043; }
    .dot.err { background: #e04040; }

    /* tabs */
    .tabs { display: flex; gap: 0; border-bottom: 2px solid #eee; margin-bottom: 1.5rem; }
    .tab {
      flex: 1; padding: .65rem 1rem; border: none; background: none;
      font-size: .92rem; font-weight: 500; color: #888; cursor: pointer;
      border-bottom: 2px solid transparent; margin-bottom: -2px;
      transition: color .15s, border-color .15s;
    }
    .tab.active { color: #4a90e2; border-bottom-color: #4a90e2; }
    .tab:hover:not(.active) { color: #555; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* upload */
    .upload-area {
      border: 2px dashed #d0d5dd; border-radius: 10px;
      padding: 1.75rem 1rem; text-align: center; cursor: pointer;
      transition: border-color .15s, background .15s;
      margin-bottom: 1rem; user-select: none;
    }
    .upload-area:hover, .upload-area.dragover { border-color: #4a90e2; background: #f5f9ff; }
    .upload-area input { display: none; }
    .upload-label { font-size: .95rem; color: #555; }
    .file-name { margin-top: .4rem; font-size: .85rem; color: #4a90e2; font-weight: 500; min-height: 1.2rem; }

    /* buttons */
    .buttons { display: flex; gap: .75rem; margin-bottom: 1.25rem; }
    button {
      flex: 1; padding: .7rem; border: none; border-radius: 8px;
      font-size: .9rem; font-weight: 500; cursor: pointer;
      transition: opacity .15s, background .15s;
    }
    button:disabled { opacity: .4; cursor: not-allowed; }
    .btn-blue   { background: #4a90e2; color: white; }
    .btn-blue:not(:disabled):hover   { background: #357abd; }
    .btn-green  { background: #2d8a4e; color: white; }
    .btn-green:not(:disabled):hover  { background: #1f6438; }
    .btn-red    { background: #c0392b; color: white; }
    .btn-red:not(:disabled):hover    { background: #a93226; }
    .btn-grey   { background: #555; color: white; }
    .btn-grey:not(:disabled):hover   { background: #333; }

    /* result */
    .status { font-size: .82rem; color: #888; margin-bottom: .6rem; min-height: 1.1rem; }
    .result-box {
      background: #fafafa; border: 1px solid #e8e8e8; border-radius: 10px;
      padding: 1.25rem; min-height: 110px;
      font-size: 1.05rem; line-height: 1.75;
      direction: rtl; text-align: right;
      white-space: pre-wrap; word-break: break-word;
    }
    .result-box.placeholder { color: #bbb; font-style: italic; font-size: .9rem; }
    .meta { font-size: .78rem; color: #aaa; margin-top: .5rem; text-align: right; }

    /* audio player */
    .audio-player { margin-bottom: 1rem; display: none; position: relative; }
    .audio-player audio { width: 100%; border-radius: 8px; }
    .audio-remove {
      position: absolute; top: 50%; right: 0; transform: translateY(-50%);
      width: 22px; height: 22px; border-radius: 50%;
      background: #bbb; color: white; border: none; cursor: pointer;
      font-size: .8rem; line-height: 22px; text-align: center; padding: 0;
      transition: background .15s;
    }
    .audio-remove:hover { background: #e04040; }

    /* live indicator */
    .live-info { font-size: .83rem; color: #888; margin-bottom: .75rem; line-height: 1.5; }
    .live-status-row { display: flex; align-items: center; gap: .5rem; margin-bottom: .6rem; min-height: 1.4rem; }
    .pulse {
      width: 10px; height: 10px; border-radius: 50%;
      background: #c0392b; display: none;
      animation: pulse 1.2s ease-in-out infinite; flex-shrink: 0;
    }
    .pulse.active { display: block; }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: .4; transform: scale(.7); }
    }
  </style>
</head>
<body>
<div class="card">

  <div class="header">
    <h1>Local STT — Hebrew</h1>
    <div class="health">
      <div class="dot" id="dot"></div>
      <span id="healthText">Connecting…</span>
    </div>
  </div>

  <!-- tabs -->
  <div class="tabs">
    <button class="tab active" onclick="showTab('file')">File</button>
    <button class="tab"        onclick="showTab('live')">Live Mic</button>
  </div>

  <!-- ── FILE TAB ─────────────────────────────────────────────── -->
  <div id="tab-file" class="tab-panel active">

    <div class="upload-area" id="uploadArea">
      <input type="file" id="fileInput" accept="audio/*">
      <div class="upload-label">Click or drag an audio file here</div>
      <div class="file-name" id="fileName"></div>
    </div>

    <div class="audio-player" id="filePlayerWrap">
      <audio id="filePlayer" controls style="width:calc(100% - 30px)"></audio>
      <button class="audio-remove" onclick="clearFile()" title="Remove file">✕</button>
    </div>

    <div class="buttons">
      <button class="btn-blue" id="btnFull" disabled onclick="transcribe()">Transcribe</button>
    </div>

    <div class="status" id="fileStatus"></div>
    <div class="result-box placeholder" id="fileResult">Transcript will appear here…</div>
    <div class="meta" id="fileMeta"></div>

  </div>

  <!-- ── LIVE TAB ──────────────────────────────────────────────── -->
  <div id="tab-live" class="tab-panel">

    <div class="buttons">
      <button class="btn-red"  id="btnLiveStart" onclick="startLive()">Start Recording</button>
      <button class="btn-grey" id="btnLiveStop"  onclick="stopLive()" disabled>Stop</button>
    </div>

    <div class="live-status-row">
      <div class="pulse" id="pulse"></div>
      <span class="status" style="margin:0" id="liveStatus"></span>
    </div>

    <div class="result-box placeholder" id="liveResult">Live transcript will appear here…</div>

    <div class="audio-player" id="livePlayerWrap">
      <audio id="livePlayer" controls></audio>
    </div>

  </div>

</div><!-- /card -->

<script>
  const API = "http://localhost:8000";

  // ── Health ──────────────────────────────────────────────────────
  async function checkHealth() {
    try {
      const r = await fetch(`${API}/health`);
      const d = await r.json();
      dot.className = d.status === "ok" ? "dot ok" : "dot err";
      healthText.textContent = d.status === "ok"
        ? `${d.device} · ${d.compute_type}`
        : "error: " + d.error;
    } catch {
      dot.className = "dot err";
      healthText.textContent = "not reachable";
    }
  }
  checkHealth();

  // ── Tabs ────────────────────────────────────────────────────────
  function showTab(name) {
    document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.getElementById("tab-" + name).classList.add("active");
    document.querySelector(`.tab[onclick="showTab('${name}')"]`).classList.add("active");
  }

  // ── File selection ───────────────────────────────────────────────
  uploadArea.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", () => {
    const f = fileInput.files[0]; if (!f) return;
    fileName.textContent = f.name;
    btnFull.disabled = false;
    fileResult.className = "result-box placeholder";
    fileResult.textContent = "Transcript will appear here…";
    fileMeta.textContent = ""; fileStatus.textContent = "";
    filePlayer.src = URL.createObjectURL(f);
    filePlayerWrap.style.display = "block";
  });
  uploadArea.addEventListener("dragover", e => { e.preventDefault(); uploadArea.classList.add("dragover"); });
  uploadArea.addEventListener("dragleave", () => uploadArea.classList.remove("dragover"));
  uploadArea.addEventListener("drop", e => {
    e.preventDefault(); uploadArea.classList.remove("dragover");
    const f = e.dataTransfer.files[0]; if (!f) return;
    const dt = new DataTransfer(); dt.items.add(f);
    fileInput.files = dt.files; fileInput.dispatchEvent(new Event("change"));
  });

  function clearFile() {
    fileInput.value = "";
    fileName.textContent = "";
    filePlayer.src = ""; filePlayerWrap.style.display = "none";
    btnFull.disabled = true;
    fileResult.className = "result-box placeholder";
    fileResult.textContent = "Transcript will appear here…";
    fileMeta.textContent = ""; fileStatus.textContent = "";
  }

  // ── Transcription (streaming) ────────────────────────────────────
  async function transcribe() {
    const file = fileInput.files[0]; if (!file) return;
    btnFull.disabled = true;
    fileStatus.textContent = "Transcribing…";
    fileResult.className = "result-box"; fileResult.textContent = "";
    fileMeta.textContent = "";
    let segCount = 0;
    const t0 = Date.now();
    try {
      const fd = new FormData(); fd.append("file", file);
      const r = await fetch(`${API}/transcribe/stream`, { method: "POST", body: fd });
      if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
      const reader = r.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";
      while (true) {
        const { done, value } = await reader.read(); if (done) break;
        buf += decoder.decode(value, { stream: true });
        const lines = buf.split("\n"); buf = lines.pop();
        for (const line of lines) {
          if (!line.startsWith("data: ")) continue;
          try {
            const d = JSON.parse(line.slice(6));
            if (d.error) { fileStatus.textContent = "Error: " + d.error; break; }
            if (d.text?.trim()) {
              fileResult.textContent += (fileResult.textContent ? " " : "") + d.text.trim();
              fileStatus.textContent = `Transcribing… (${++segCount} segment${segCount !== 1 ? "s" : ""})`;
            }
          } catch {}
        }
      }
      if (!segCount) {
        fileResult.className = "result-box placeholder";
        fileResult.textContent = "(no speech detected)";
      }
      fileStatus.textContent = "Done.";
      fileMeta.textContent = `${((Date.now()-t0)/1000).toFixed(1)}s`;
    } catch (e) {
      fileStatus.textContent = "Error: " + e.message;
      fileResult.className = "result-box placeholder"; fileResult.textContent = "";
    }
    btnFull.disabled = false;
  }

  // ── Live mode ────────────────────────────────────────────────────
  const SEGMENT_MS = 4000;
  let liveStream = null, liveRecorder = null;
  let isLive = false, liveText = "", segTimer = null;
  let allChunks = [], liveMimeType = "";

  async function startLive() {
    try {
      liveStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      liveStatus.textContent = "Mic access denied: " + e.message; return;
    }
    isLive = true; liveText = ""; allChunks = [];
    livePlayerWrap.style.display = "none"; livePlayer.src = "";
    liveResult.className = "result-box"; liveResult.textContent = "";
    btnLiveStart.disabled = true; btnLiveStop.disabled = false;
    pulse.classList.add("active");
    liveStatus.textContent = "Recording…";
    recordSegment();
  }

  function stopLive() {
    isLive = false;
    clearTimeout(segTimer);
    if (liveRecorder && liveRecorder.state === "recording") liveRecorder.stop();
    if (liveStream) liveStream.getTracks().forEach(t => t.stop());
    btnLiveStart.disabled = false; btnLiveStop.disabled = true;
    pulse.classList.remove("active");
    liveStatus.textContent = liveText ? "Stopped." : "Stopped — nothing recorded.";
  }

  function recordSegment() {
    if (!isLive) return;
    const chunks = [];
    const mimeType = ["audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus",""]
      .find(t => t === "" || MediaRecorder.isTypeSupported(t));
    liveRecorder = new MediaRecorder(liveStream, mimeType ? { mimeType } : {});
    liveMimeType = liveRecorder.mimeType;
    liveRecorder.ondataavailable = e => { if (e.data.size > 0) { chunks.push(e.data); allChunks.push(e.data); } };
    liveRecorder.onstop = async () => {
      if (!chunks.length) { if (isLive) recordSegment(); return; }
      pulse.classList.remove("active");
      liveStatus.textContent = "Transcribing segment…";
      const blob = new Blob(chunks, { type: liveRecorder.mimeType || "audio/webm" });
      try {
        const fd = new FormData();
        fd.append("file", blob, "segment.webm");
        const r = await fetch(`${API}/transcribe`, { method: "POST", body: fd });
        if (r.ok) {
          const d = await r.json();
          if (d.text?.trim()) {
            liveText += (liveText ? " " : "") + d.text.trim();
            liveResult.textContent = liveText;
          }
        }
      } catch {}
      if (isLive) {
        pulse.classList.add("active");
        liveStatus.textContent = "Recording…";
        recordSegment();
      } else if (allChunks.length) {
        const blob = new Blob(allChunks, { type: liveMimeType || "audio/webm" });
        livePlayer.src = URL.createObjectURL(blob);
        livePlayerWrap.style.display = "block";
      }
    };
    liveRecorder.start();
    segTimer = setTimeout(() => {
      if (liveRecorder.state === "recording") liveRecorder.stop();
    }, SEGMENT_MS);
  }
</script>
</body>
</html>
